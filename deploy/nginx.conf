# Same-origin SPA + reverse-proxy to API.
# Substituted at container start via envsubst:
#   API_PROXY_PASS  full upstream base, e.g.
#     Compose:  http://tokenops-api:3000
#     Railway:  https://tokenops-api-production.up.railway.app
#   API_PROXY_HOST  Host header for upstream (hostname only)

server {
    # Railway injects PORT and probes THAT port for the healthcheck. A hardcoded
    # `listen 80` means the probe reaches nothing, nginx logs no request at all,
    # and the deploy fails while nginx is running perfectly. web.Dockerfile
    # defaults PORT=80 so Compose is unaffected.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — browser stays same-origin; cookies work.
    location /v1/ {
        proxy_pass ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host ${API_PROXY_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell API requests arrived via HTTPS so Secure cookies are set
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location = /health {
        proxy_pass ${API_PROXY_PASS}/health;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_set_header Host ${API_PROXY_HOST};
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
