# Same-origin setup: serve SPA and proxy API under /v1 (and /health).
# API_UPSTREAM is substituted at container start (envsubst).
# Compose default: tokenops-api:3000
# Railway private network: tokenops-api.railway.internal:3000

upstream tokenops_api {
    server ${API_UPSTREAM};
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — full URI passed through
    location /v1/ {
        proxy_pass http://tokenops_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location = /health {
        proxy_pass http://tokenops_api/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
