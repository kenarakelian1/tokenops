# TokenOps Phase 1 — local / self-host stack
# From repo root:
#   docker compose -f deploy/docker-compose.yml up --build
#
# Dashboard: http://localhost:8080  (nginx → static web + /v1 proxy)
# API direct: http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokenops
      POSTGRES_PASSWORD: tokenops
      POSTGRES_DB: tokenops
    ports:
      - "5432:5432"
    volumes:
      - tokenops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenops -d tokenops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tokenops:tokenops@db:5432/tokenops
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      HOST: 0.0.0.0
      PORT: "3000"
      # Self-host defaults: no machine cap, unlimited raw event retention
      HOSTED_LIMITS: ${HOSTED_LIMITS:-false}
      # Optional — only pass when set (empty strings break Zod .optional() without emptyToUndefined):
      # RAW_EVENT_RETENTION_DAYS: "30"
      # CORS_ORIGIN: http://localhost:5173
      # BOOTSTRAP_EMAIL: admin@example.com
      # BOOTSTRAP_PASSWORD: your-secure-password
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  tokenops_pg:
