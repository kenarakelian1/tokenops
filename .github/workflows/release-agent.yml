name: Release desktop agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package agent
        run: pnpm package:agent

      - name: Zip package
        shell: pwsh
        run: |
          if (Test-Path dist/tokenops-agent-win.zip) { Remove-Item dist/tokenops-agent-win.zip -Force }
          Compress-Archive -Path dist/tokenops-agent-win/* -DestinationPath dist/tokenops-agent-win.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenops-agent-win
          path: dist/tokenops-agent-win.zip

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tokenops-agent-win.zip
          generate_release_notes: true
          body: |
            ## Windows desktop agent

            1. Install [Node.js 22+](https://nodejs.org/)
            2. Download **tokenops-agent-win.zip**
            3. Unzip → double-click **install.cmd**
            4. Complete the wizard → Start Menu → **TokenOps Agent**

            Dashboard: https://tokenops-web-production.up.railway.app

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v0.0.{0}', github.run_number) }}
          name: ${{ inputs.tag != '' && inputs.tag || format('Desktop agent build {0}', github.run_number) }}
          files: dist/tokenops-agent-win.zip
          generate_release_notes: true
          body: |
            ## Windows desktop agent

            1. Install [Node.js 22+](https://nodejs.org/)
            2. Download **tokenops-agent-win.zip**
            3. Unzip → double-click **install.cmd**

            Dashboard: https://tokenops-web-production.up.railway.app
