name: Release desktop agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package agent + Setup.exe
        run: pnpm package:agent

      - name: Zip portable package
        shell: pwsh
        run: |
          if (Test-Path dist/tokenops-agent-win.zip) { Remove-Item dist/tokenops-agent-win.zip -Force }
          Compress-Archive -Path dist/tokenops-agent-win/* -DestinationPath dist/tokenops-agent-win.zip -Force
          Get-ChildItem dist -Filter "TokenOps*" | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokenops-agent-windows
          path: |
            dist/tokenops-agent-win.zip
            dist/TokenOps-Agent-Setup.exe

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TokenOps-Agent-Setup.exe
            dist/tokenops-agent-win.zip
          generate_release_notes: true
          body: |
            ## Windows desktop agent

            ### Recommended: Setup wizard
            1. Install [Node.js 22+](https://nodejs.org/)
            2. Download **TokenOps-Agent-Setup.exe**
            3. Run the setup (per-user, no admin)
            4. Pick your AI tools, paste PAT, choose startup
            5. Start Menu → **TokenOps Agent**

            ### Portable zip
            Download **tokenops-agent-win.zip**, unzip, run **install.cmd**

            Dashboard: https://tokenops-web-production.up.railway.app

            > Setup is not Authenticode-signed yet. If Smart App Control / SmartScreen warns: More info → Run anyway, or Unblock the file.

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v0.1.{0}', github.run_number) }}
          name: ${{ inputs.tag != '' && inputs.tag || format('TokenOps Agent {0}', github.run_number) }}
          files: |
            dist/TokenOps-Agent-Setup.exe
            dist/tokenops-agent-win.zip
          generate_release_notes: true
          body: |
            ## Windows desktop agent

            1. Install [Node.js 22+](https://nodejs.org/)
            2. Download **TokenOps-Agent-Setup.exe** and run it
            3. Or use **tokenops-agent-win.zip** → install.cmd

            Dashboard: https://tokenops-web-production.up.railway.app
