name: Release desktop agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app (and its workspace dependencies)
        # See ci.yml's identically-named step: @tokenops/desktop dynamically
        # imports @tokenops/agent at runtime, so the trailing "..." (build
        # dependencies too) is required, not optional.
        run: pnpm --filter "@tokenops/desktop..." build

      - name: Package portable agent payload
        # Headless/CI installs still use this path (installer/windows/install.cmd
        # against a system Node 22+). It no longer compiles an Inno Setup.exe --
        # apps/desktop/electron-builder.yml + the step below own the GUI installer.
        run: pnpm package:agent

      - name: Zip portable package
        shell: pwsh
        run: |
          if (Test-Path dist/tokenops-agent-win.zip) { Remove-Item dist/tokenops-agent-win.zip -Force }
          Compress-Archive -Path dist/tokenops-agent-win/* -DestinationPath dist/tokenops-agent-win.zip -Force

      - name: Package with electron-builder
        run: pnpm --filter @tokenops/desktop exec electron-builder --win --publish never

      - name: Verify installer was produced
        # softprops/action-gh-release silently skips a `files:` glob that
        # matches nothing, and upload-artifact defaults to warn-not-fail on a
        # missing path -- both would let this job go green and publish (or
        # upload) a release that advertises an asset it never attaches. Fail
        # loudly here instead, before either of those steps can run.
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "TokenOps-Setup-*.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "electron-builder produced no installer" }
          Get-ChildItem dist -Filter "TokenOps*" | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokenops-agent-windows
          path: |
            dist/tokenops-agent-win.zip
            dist/TokenOps-Setup-*.exe

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TokenOps-Setup-*.exe
            dist/tokenops-agent-win.zip
          generate_release_notes: true
          body: |
            ## Windows desktop agent

            ### Recommended: TokenOps installer
            1. Download **TokenOps-Setup-<version>.exe** (attached below)
            2. Run the setup (per-user, no admin)
            3. Start Menu → **TokenOps**

            Electron bundles its own Node, so no separate Node.js install is
            needed for this path.

            ### Portable zip (headless / CI installs)
            Download **tokenops-agent-win.zip**, unzip, run **install.cmd**
            (requires [Node.js 22+](https://nodejs.org/) already on PATH)

            Dashboard: https://tokenops-web-production.up.railway.app

            > Not Authenticode-signed yet. If Smart App Control / SmartScreen warns: More info → Run anyway, or Unblock the file.

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v0.1.{0}', github.run_number) }}
          name: ${{ inputs.tag != '' && inputs.tag || format('TokenOps Agent {0}', github.run_number) }}
          files: |
            dist/TokenOps-Setup-*.exe
            dist/tokenops-agent-win.zip
          generate_release_notes: true
          body: |
            ## Windows desktop agent

            1. Download **TokenOps-Setup-<version>.exe** (attached below) and run it
            2. Or use **tokenops-agent-win.zip** → install.cmd (requires Node.js 22+)

            Dashboard: https://tokenops-web-production.up.railway.app
