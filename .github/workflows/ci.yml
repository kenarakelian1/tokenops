name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @tokenops/shared build

      - name: Test
        run: pnpm test

      - name: Build packages
        # @tokenops/web's vite.config.ts throws at build time without a Clerk
        # publishable key (it's baked into the client bundle). A publishable
        # key is public by design, so a repo Actions *variable* is the right
        # place for a real one — but the fallback placeholder means a fresh
        # checkout/fork is green with zero repo configuration; only the
        # string is inlined at build time, so a real value is never required
        # for `build` to succeed.
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder_0000000000000000000000000000' }}
        run: |
          pnpm --filter @tokenops/api build
          pnpm --filter @tokenops/agent build
          pnpm --filter @tokenops/web build

  # The installer only ever breaks at release time otherwise: ISCC is not on the
  # Linux job, so compile errors in TokenOpsAgent.iss reach users unreviewed.
  # Runtime errors in its Pascal script (e.g. indexing a page's Edits array past
  # its Add() count) are caught by the Vitest guard in the `test` job above.
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package agent + compile Setup.exe
        run: pnpm package:agent

      - name: Verify Setup.exe was produced
        shell: pwsh
        run: |
          # package:agent skips ISCC silently when it is not found, so assert the
          # artifact exists rather than trusting a zero exit code.
          if (-not (Test-Path dist/TokenOps-Agent-Setup.exe)) {
            throw "TokenOps-Agent-Setup.exe was not produced - Inno Setup compile was skipped or failed"
          }
          Get-Item dist/TokenOps-Agent-Setup.exe | Format-List Name, Length
