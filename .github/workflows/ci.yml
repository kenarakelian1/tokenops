name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @tokenops/shared build

      - name: Test
        run: pnpm test

      - name: Build packages
        # @tokenops/web's vite.config.ts throws at build time without a Clerk
        # publishable key (it's baked into the client bundle). A publishable
        # key is public by design, so a repo Actions *variable* is the right
        # place for a real one — but the fallback placeholder means a fresh
        # checkout/fork is green with zero repo configuration; only the
        # string is inlined at build time, so a real value is never required
        # for `build` to succeed.
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder_0000000000000000000000000000' }}
        run: |
          pnpm --filter @tokenops/api build
          pnpm --filter @tokenops/agent build
          pnpm --filter @tokenops/web build

  # The installer only ever breaks at release time otherwise: this job compiles
  # the real electron-builder NSIS installer on windows-latest so a build that
  # silently fails or skips packaging is caught here, not by a user.
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm --filter @tokenops/desktop build

      - name: Package with electron-builder
        run: pnpm --filter @tokenops/desktop exec electron-builder --win --publish never

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "TokenOps-Setup-*.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "electron-builder produced no installer" }
          Get-Item $exe.FullName | Format-List Name, Length
