name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @tokenops/shared build

      - name: Test
        run: pnpm test

      - name: Build packages
        run: |
          pnpm --filter @tokenops/api build
          pnpm --filter @tokenops/agent build
          pnpm --filter @tokenops/web build
